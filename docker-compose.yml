services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: matriculas-sqlserver
    hostname: matriculas-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:-Matriculas@2026}"
      MSSQL_PID: Developer
    ports:
      - "${MSSQL_PORT:-1433}:1433"
    volumes:
      - matriculas_mssql_data:/var/opt/mssql
      - ./docker/sqlserver/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q \"SELECT 1\" || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s
    networks:
      - matriculas-net

  sqlserver-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: matriculas-sqlserver-init
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:-Matriculas@2026}"
      MSSQL_DB: "${MSSQL_DB:-matriculas_db}"
    volumes:
      - ./docker/sqlserver/init:/scripts:ro
    entrypoint:
      - /bin/bash
      - -c
      - |
        /opt/mssql-tools18/bin/sqlcmd -S sqlserver -U sa -P "$$MSSQL_SA_PASSWORD" -C -i /scripts/01-create-database.sql
        echo "Database $$MSSQL_DB pronto."
    networks:
      - matriculas-net
    restart: "no"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: matriculas-backend
    environment:
      SPRING_PROFILES_ACTIVE: docker
      MSSQL_HOST: sqlserver
      MSSQL_PORT: "1433"
      MSSQL_DB: "${MSSQL_DB:-matriculas_db}"
      SPRING_DATASOURCE_USERNAME: "${SPRING_DATASOURCE_USERNAME:-sa}"
      SPRING_DATASOURCE_PASSWORD: "${SPRING_DATASOURCE_PASSWORD:-Matriculas@2026}"
      SERVER_PORT: "8080"
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      sqlserver:
        condition: service_healthy
      sqlserver-init:
        condition: service_completed_successfully
    networks:
      - matriculas-net
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: matriculas-frontend
    ports:
      - "${FRONTEND_PORT:-4200}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - matriculas-net
    restart: unless-stopped

volumes:
  matriculas_mssql_data:

networks:
  matriculas-net:
    name: matriculas-net
