<section class="panel">
  <header>
    <h2>Turmas</h2>
    <p>Controle de vagas e status (ABERTA / FECHADA).</p>
  </header>

  <form class="form-grid" [formGroup]="form" (ngSubmit)="salvar()">
    <label>
      Disciplina
      <select formControlName="disciplinaId">
        <option [ngValue]="0" disabled>Selecione</option>
        <option *ngFor="let d of disciplinas" [ngValue]="d.id">{{ d.codigo }} - {{ d.nome }}</option>
      </select>
    </label>
    <label>
      Codigo
      <input formControlName="codigo" placeholder="T1" />
    </label>
    <label>
      Periodo
      <input formControlName="periodo" placeholder="2026.1" />
    </label>
    <label>
      Vagas totais
      <input formControlName="vagasTotais" type="number" min="0" />
    </label>
    <div class="actions">
      <button type="submit">{{ editandoId ? 'Atualizar' : 'Cadastrar' }}</button>
      <button type="button" class="ghost" (click)="limpar()" *ngIf="editandoId">Cancelar</button>
    </div>
  </form>

  <div class="table-wrap" *ngIf="turmas.length; else vazio">
    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Disc.</th>
          <th>Codigo</th>
          <th>Periodo</th>
          <th>Vagas</th>
          <th>Status</th>
          <th></th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let t of turmas">
          <td>{{ t.id }}</td>
          <td>{{ t.disciplinaCodigo }}</td>
          <td>{{ t.codigo }}</td>
          <td>{{ t.periodo }}</td>
          <td>{{ t.vagasOcupadas }}/{{ t.vagasTotais }}</td>
          <td>
            <span class="badge" [class.open]="t.status === 'ABERTA'" [class.closed]="t.status === 'FECHADA'">
              {{ t.status }}
            </span>
          </td>
          <td class="row-actions">
            <button type="button" class="link" (click)="editar(t)">Editar</button>
            <button type="button" class="link" (click)="abrir(t)" *ngIf="t.status === 'FECHADA'">Abrir</button>
            <button type="button" class="link" (click)="fechar(t)" *ngIf="t.status === 'ABERTA'">Fechar</button>
            <button type="button" class="link danger" (click)="excluir(t)">Excluir</button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
  <ng-template #vazio>
    <p class="empty">Nenhuma turma cadastrada.</p>
  </ng-template>
</section>
