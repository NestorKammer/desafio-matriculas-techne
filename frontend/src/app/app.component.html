<div class="layout">
  <aside class="sidebar">
    <div class="brand">
      <span class="brand-mark">MA</span>
      <div>
        <strong>{{ titulo }}</strong>
        <small>Desafio Techne</small>
      </div>
    </div>
    <nav>
      <a routerLink="/matriculas" routerLinkActive="active">Matriculas</a>
      <a routerLink="/alunos" routerLinkActive="active">Alunos</a>
      <a routerLink="/cursos" routerLinkActive="active">Cursos</a>
      <a routerLink="/disciplinas" routerLinkActive="active">Disciplinas</a>
      <a routerLink="/turmas" routerLinkActive="active">Turmas</a>
    </nav>
  </aside>

  <main class="content">
    <div
      class="toast"
      *ngIf="notify.mensagem() as msg"
      [class.ok]="notify.tipo() === 'ok'"
      [class.erro]="notify.tipo() === 'erro'"
    >
      <span>{{ msg }}</span>
      <button type="button" (click)="notify.limpar()">Fechar</button>
    </div>
    <router-outlet />
  </main>
</div>
